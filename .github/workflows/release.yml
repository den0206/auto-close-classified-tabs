name: Release

# release/Ver_X.Y.Z ブランチへ push すると VSIX を作り、GitHub Release に出す。
# OVSX_TOKEN が登録されていれば Open VSX にも公開する(無ければスキップ)。
# ci.yml は release/** では走らないので、公開前のゲートはここだけ。
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  release:
    name: Package & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # 既存の Ver_* タグと突き合わせて採番するため全履歴・全タグが要る
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Verify tests
        run: npm run typecheck && npm test

      # VS Code を実際に起動する統合テスト。ヘッドレスなので xvfb を噛ませる。
      - name: Integration test
        run: xvfb-run -a npm run test:e2e

      - name: Resolve version from branch
        id: meta
        if: startsWith(github.ref_name, 'release/Ver_')
        run: |
          VERSION="${GITHUB_REF_NAME##*/Ver_}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::branch '$GITHUB_REF_NAME' が release/Ver_X.Y.Z 形式ではありません"
            exit 1
          fi

          EXISTING="$(git ls-remote --tags origin | sed -n 's#.*refs/tags/\(Ver_[0-9][0-9A-Za-z.+-]*\)$#\1#p' | sort -u)"

          # 公開済みリリースは不変。同じ版を作り直したくなったら patch を上げる。
          # Open VSX は公開の取り消しが効かないため、ここで止める。
          if printf '%s\n' "$EXISTING" | grep -Fxq "Ver_$VERSION"; then
            echo "::error::Ver_$VERSION は既に公開済みです。patch を上げてください"
            exit 1
          fi

          # ブランチ名のタイプミスで古いバージョンを公開してしまうのを防ぐ。
          HIGHEST="$(printf '%s\n' "$EXISTING" | sed 's/^Ver_//; s/+.*//' | sort -V | tail -1)"
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::Ver_$VERSION は既存の最新 Ver_$HIGHEST より古いバージョンです。ブランチ名を確認してください"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=Ver_$VERSION"
            echo "asset=auto-close-classified-tabs-$VERSION.vsix"
          } >> "$GITHUB_OUTPUT"

      - name: Apply version
        if: steps.meta.outputs.version
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      # 公開ページ(Open VSX / Marketplace)が出すのは **VSIX 内の CHANGELOG.md** なので、
      # パッケージより前に切り出す。後から main だけ直しても公開ページは Unreleased のまま。
      - name: Cut CHANGELOG
        if: steps.meta.outputs.version
        run: |
          RELEASE_DATE="$(date -u +%F)"
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"
          node scripts/release-changelog.js "${{ steps.meta.outputs.version }}" "$RELEASE_DATE"

      - name: Package VSIX
        run: npm run package

      # l10n を落とすと日本語環境で UI が英語に化けるだけでビルドは通ってしまう。
      # .vscodeignore の事故に気づけるよう梱包物を明示的に確認する(ci.yml と同じ検査)。
      - name: Verify VSIX contents
        run: |
          unzip -l vsix/auto-close-classified-tabs.vsix | grep -q 'package.nls.ja.json' \
            || { echo "::error::package.nls.ja.json が VSIX に入っていません"; exit 1; }
          unzip -l vsix/auto-close-classified-tabs.vsix | grep -q 'l10n/bundle.l10n.ja.json' \
            || { echo "::error::l10n バンドルが VSIX に入っていません"; exit 1; }
          unzip -l vsix/auto-close-classified-tabs.vsix | grep -q 'media/icon.png' \
            || { echo "::error::アイコンが VSIX に入っていません"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: auto-close-classified-tabs-${{ github.run_number }}
          path: vsix/*.vsix
          if-no-files-found: error
          retention-days: 30

      # リリースノートは切り出し済みの CHANGELOG から該当節を抜く。
      # [Unreleased] が空で切り出しが no-op だった場合は空になるので、gh の
      # --generate-notes(コミットから生成)へ落とす。
      - name: Create GitHub Release
        if: steps.meta.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          cp vsix/auto-close-classified-tabs.vsix "$ASSET"

          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"

          if [ -s "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            echo "::warning::CHANGELOG に $VERSION の節が無いためコミットからリリースノートを生成します"
            NOTES_ARGS=(--generate-notes)
          fi

          # $TAG が空きであることは meta で確認済み。公開済みリリースは上書きしない。
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Auto Close Classified Tabs ${VERSION}" \
            "${NOTES_ARGS[@]}"

      # Open VSX (Cursor / VSCodium の拡張機能検索) へ公開する。
      # OVSX_TOKEN が未登録なら警告だけ出してスキップする(GitHub Release は出ている)。
      #
      # 名前空間 (package.json の publisher) は初回のみ手動で作る:
      #   npx ovsx@1.1.1 create-namespace yuuki-sakai -p <token>
      - name: Publish to Open VSX
        if: steps.meta.outputs.tag
        env:
          # ovsx は OVSX_PAT を自動で読む。-p で argv に渡すと未設定時に対話プロンプトへ
          # 落ちて CI がハングするため env で渡す(空文字なら即失敗する)。
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_TOKEN が未設定のため Open VSX への公開をスキップしました"
            exit 0
          fi
          # 版を固定する。ここは公開トークンを持つステップなので、latest を取りに行くと
          # ovsx 側の侵害がそのままトークンの窃取になる(npm を狙うワームの定石)。
          npx --yes ovsx@1.1.1 publish vsix/auto-close-classified-tabs.vsix --skip-duplicate

      # 版上げと CHANGELOG の切り出しを main へ直接コミットする。release ブランチに
      # コミットすると main が古いまま取り残され、手動マージ待ちの運用が生まれるため。
      # 作業ツリーは持ち運ばず main の最新からやり直す
      # (持ち運ぶとリリース中に main へ入った別の編集を巻き戻す危険がある)。
      - name: Sync version to main
        if: steps.meta.outputs.tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          # この自動化が main に運ぶのは package.json の version と CHANGELOG.md の切り出しだけ。
          # release ブランチ上で直接コードを直した場合は取りこぼすので、気づけるように警告を出す。
          UNMERGED="$(git log --oneline "origin/main..$GITHUB_SHA")"
          if [ -n "$UNMERGED" ]; then
            echo "::warning::release ブランチに main 未取り込みのコミットがあります。手動で main に取り込んでください:"
            echo "$UNMERGED"
          fi

          # -f で作業ツリーの変更を捨てる (下で main の内容から作り直すため)
          git switch -f -C main origin/main
          npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version
          # VSIX へ入れたのと同じ切り出しを main にも反映する(日付も揃える)。
          # main 側で [Unreleased] が空なら何もしない。
          node scripts/release-changelog.js "${{ steps.meta.outputs.version }}" "$RELEASE_DATE"

          git add package.json package-lock.json CHANGELOG.md
          git diff --cached --quiet && exit 0
          # [skip ci] がこの push による CI 再実行を防ぐ
          git commit -m "chore: ${{ steps.meta.outputs.tag }} の版と CHANGELOG を反映 [skip ci]"
          if ! git push origin main; then
            echo "::error::main への push に失敗しました。main がブランチ保護されている場合は github-actions をバイパスに追加してください"
            exit 1
          fi
